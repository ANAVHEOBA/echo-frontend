<!DOCTYPE html>
<html>
<head>
    <title>Reporting Intelligence Component Test</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Inter, sans-serif;
            background: #1a3742;
        }
        .container {
            max-width: 1280px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            margin-bottom: 40px;
        }
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 9999px;
            padding: 8px 16px;
            color: white;
            font-size: 14px;
            margin-bottom: 24px;
        }
        h1 {
            color: white;
            font-size: 56px;
            font-weight: 500;
            margin: 0 0 16px 0;
            line-height: 1.1;
        }
        .subtitle {
            color: rgba(255, 255, 255, 0.8);
            font-size: 18px;
            max-width: 800px;
            margin: 0 auto 48px;
            line-height: 1.6;
        }
        .button {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.9);
            color: #1a3742;
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.2s;
            margin-bottom: 64px;
        }
        .button:hover {
            background: white;
            transform: scale(1.05);
        }
        .cards {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 32px;
            margin-top: 40px;
        }
        .card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        .card h3 {
            color: #4285F4;
            font-size: 36px;
            font-weight: 600;
            text-align: center;
            margin: 0 0 32px 0;
        }
        .card img {
            width: 100%;
            height: auto;
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="badge">
                ⭐ Reporting and Intelligence
            </div>
            <h1>Sales Management's<br>Best Friend</h1>
            <p class="subtitle">
                Ergo Reporting turns every interaction into actionable revenue intelligence—giving leadership instant visibility into trends, risks, and opportunities across the funnel.
            </p>
            <a href="#" class="button">
                ↗ Get Started
            </a>
        </div>
        
        <div class="cards">
            <div class="card">
                <h3>Objections</h3>
                <img src="/images/gTu3A6h8raO4xbpNEarwV2K5r8.png" alt="Objections Chart">
            </div>
            <div class="card">
                <h3>Pain points</h3>
                <img src="/images/QBEvDA0nf1GwkZVHb5F9uxAs_3.png" alt="Pain Points Chart">
            </div>
        </div>
    </div>
</body>
</html>
