<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ergo Connection Animation</title>
    <style>
        :root {
            --bg-dark: #052233; /* Background color from site */
            --accent-green: #A9ED42; /* Primary accent color */
            --node-bg: rgba(255, 255, 255, 0.05);
            --line-color: rgba(169, 237, 66, 0.2);
        }

        body {
            margin: 0;
            background-color: var(--bg-dark);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
        }

        .container {
            position: relative;
            width: 600px;
            height: 400px;
        }

        /* Central Ergo Node */
        .center-node {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80px;
            height: 80px;
            background: var(--accent-green);
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 30px rgba(169, 237, 66, 0.4);
            z-index: 10;
        }

        .center-node svg {
            width: 40px;
            height: 40px;
            fill: var(--bg-dark);
        }

        /* Peripheral Nodes */
        .node {
            position: absolute;
            width: 50px;
            height: 50px;
            background: var(--node-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 10px;
            text-align: center;
        }

        /* Position the tools */
        .node.salesforce { top: 10%; left: 10%; }
        .node.apollo     { top: 10%; right: 10%; }
        .node.outreach   { bottom: 10%; left: 10%; }
        .node.gmail      { bottom: 10%; right: 10%; }

        /* Connection Lines */
        svg.connections {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .path-line {
            fill: none;
            stroke: var(--line-color);
            stroke-width: 2;
        }

        /* Animated Pulse Effect */
        .pulse-dot {
            fill: var(--accent-green);
            filter: drop-shadow(0 0 5px var(--accent-green));
        }

        @keyframes flow {
            from { offset-distance: 0%; }
            to { offset-distance: 100%; }
        }

        .animated-dot {
            width: 6px;
            height: 6px;
            background: var(--accent-green);
            border-radius: 50%;
            position: absolute;
            offset-rotate: auto;
            animation: flow 3s infinite linear;
        }

        /* Specific paths for the dots */
        .dot1 { offset-path: path('M 90 70 L 260 170'); }
        .dot2 { offset-path: path('M 510 70 L 340 170'); animation-delay: 1s; }
        .dot3 { offset-path: path('M 90 330 L 260 230'); animation-delay: 0.5s; }
        .dot4 { offset-path: path('M 510 330 L 340 230'); animation-delay: 1.5s; }

    </style>
</head>
<body>

    <div class="container">
        <svg class="connections">
            <line x1="90" y1="70" x2="260" y2="170" class="path-line" />
            <line x1="510" y1="70" x2="340" y2="170" class="path-line" />
            <line x1="90" y1="330" x2="260" y2="230" class="path-line" />
            <line x1="510" y1="330" x2="340" y2="230" class="path-line" />
        </svg>

        <div class="animated-dot dot1"></div>
        <div class="animated-dot dot2"></div>
        <div class="animated-dot dot3"></div>
        <div class="animated-dot dot4"></div>

        <div class="center-node">
            <svg viewBox="0 0 256 256">
                <path d="M223.68,66.15,135.68,18a15.88,15.88,0,0,0-15.36,0l-88,48.17a16,16,0,0,0-8.32,14v95.64a16,16,0,0,0,8.32,14l88,48.17a15.88,15.88,0,0,0,15.36,0l88-48.17a16,16,0,0,0,8.32-14V80.18A16,16,0,0,0,223.68,66.15ZM128,120,47.65,76,128,32l80.35,44Zm8,99.64V133.83l80-43.78v85.76Z"></path>
            </svg>
        </div>

        <div class="node salesforce">Salesforce</div>
        <div class="node apollo">Apollo</div>
        <div class="node outreach">Outreach</div>
        <div class="node gmail">Gmail</div>
    </div>

</body>
</html>
